<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Testing Portal — Bookkeeping Backend</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --surface3: #30363d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent: #58a6ff;
      --accent-dim: #1f3a5f;
      --green: #3fb950;
      --green-dim: #1a3a24;
      --red: #f85149;
      --red-dim: #3a1a1a;
      --yellow: #e3b341;
      --yellow-dim: #3a2e10;
      --purple: #bc8cff;
      --orange: #ffa657;
      --method-get: #3fb950;
      --method-post: #58a6ff;
      --sidebar-w: 280px;
      --header-h: 52px;
      --radius: 6px;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

    /* ── Header ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100;
    }
    .logo { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .logo-icon { width: 26px; height: 26px; background: linear-gradient(135deg,#58a6ff,#bc8cff); border-radius: 6px; display:flex; align-items:center; justify-content:center; font-size:14px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--surface3); color: var(--text-muted); font-weight: 500; }
    header .spacer { flex: 1; }
    #base-url-input {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 5px 10px; font-size: 13px; font-family: var(--mono);
      width: 380px; outline: none;
    }
    #base-url-input:focus { border-color: var(--accent); }
    .header-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    /* ── Layout ── */
    .layout {
      position: fixed; top: var(--header-h); bottom: 0; left: 0; right: 0;
      display: flex;
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--surface); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 12px 0;
    }
    .sidebar-section { margin-bottom: 4px; }
    .sidebar-group {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--text-dim); padding: 8px 16px 4px; text-transform: uppercase;
    }
    .endpoint-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; cursor: pointer; transition: background 0.12s;
      border-left: 3px solid transparent;
    }
    .endpoint-item:hover { background: var(--surface2); }
    .endpoint-item.active { background: var(--accent-dim); border-left-color: var(--accent); }
    .method-badge {
      font-size: 10px; font-weight: 700; font-family: var(--mono);
      padding: 1px 5px; border-radius: 3px; white-space: nowrap; min-width: 34px; text-align: center;
    }
    .method-badge.GET  { background: rgba(63,185,80,0.15);  color: var(--method-get); }
    .method-badge.POST { background: rgba(88,166,255,0.15); color: var(--method-post); }
    .endpoint-label { font-size: 12px; color: var(--text-muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .endpoint-item.active .endpoint-label { color: var(--text); }

    .run-all-btn {
      display: block; margin: 12px 16px; padding: 7px;
      background: var(--surface3); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
      text-align: center; transition: all 0.15s;
    }
    .run-all-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

    /* pass/fail dot */
    .status-dot { width: 7px; height: 7px; border-radius: 50%; margin-left: auto; flex-shrink: 0; }
    .status-dot.pass { background: var(--green); }
    .status-dot.fail { background: var(--red); }
    .status-dot.idle { background: var(--surface3); }
    .status-dot.running { background: var(--yellow); animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Main panel ── */
    main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }

    .request-panel {
      flex-shrink: 0; padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .endpoint-title {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .endpoint-title h2 { font-size: 15px; font-weight: 600; color: var(--text); }
    .endpoint-title .method-full {
      font-size: 13px; font-weight: 700; font-family: var(--mono);
      padding: 2px 10px; border-radius: var(--radius);
    }
    .endpoint-title .method-full.GET  { background: rgba(63,185,80,0.12);  color: var(--method-get);  border: 1px solid rgba(63,185,80,0.3); }
    .endpoint-title .method-full.POST { background: rgba(88,166,255,0.12); color: var(--method-post); border: 1px solid rgba(88,166,255,0.3); }
    .endpoint-url {
      font-family: var(--mono); font-size: 13px; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 6px 12px; margin-bottom: 14px;
    }
    .endpoint-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }

    .body-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
    }
    .body-actions { display: flex; gap: 6px; margin-left: auto; }
    .btn-tiny {
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-muted); cursor: pointer; transition: all 0.12s;
    }
    .btn-tiny:hover { background: var(--surface3); color: var(--text); }

    #request-body {
      width: 100%; min-height: 160px; max-height: 240px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.55;
      padding: 10px 12px; resize: vertical; outline: none;
      tab-size: 2;
    }
    #request-body:focus { border-color: var(--accent); }

    .send-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    #send-btn {
      padding: 8px 20px; border-radius: var(--radius); border: none;
      background: var(--accent); color: #000; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
    }
    #send-btn:hover { background: #79b8ff; }
    #send-btn:disabled { background: var(--surface3); color: var(--text-dim); cursor: not-allowed; }
    #send-btn .spinner {
      width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #000; border-radius: 50%; animation: spin 0.6s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #send-btn.loading .spinner { display: block; }
    #send-btn.loading .send-label { display: none; }

    #timeout-input {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 6px 8px; font-size: 12px; width: 80px; outline: none;
      font-family: var(--mono);
    }
    #timeout-input:focus { border-color: var(--accent); }
    .timeout-label { font-size: 12px; color: var(--text-muted); }

    #auth-token-input {
      background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); padding: 6px 10px; font-size: 12px; font-family: var(--mono);
      width: 240px; outline: none;
    }
    #auth-token-input:focus { border-color: var(--accent); }
    #auth-token-input::placeholder { color: var(--text-dim); }

    /* ── Response panel ── */
    .response-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); }

    .response-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 24px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .response-toolbar span { font-size: 12px; color: var(--text-muted); }
    #response-status {
      font-family: var(--mono); font-size: 13px; font-weight: 700;
      padding: 2px 10px; border-radius: var(--radius);
    }
    #response-status.ok  { background: var(--green-dim);  color: var(--green); }
    #response-status.err { background: var(--red-dim);    color: var(--red); }
    #response-status.idle { color: var(--text-dim); background: none; font-weight: 400; }
    #response-time { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
    .copy-btn {
      margin-left: auto; padding: 4px 12px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted);
      font-size: 12px; cursor: pointer; transition: all 0.12s;
    }
    .copy-btn:hover { background: var(--surface3); color: var(--text); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    #response-body {
      flex: 1; overflow: auto; padding: 16px 24px;
      font-family: var(--mono); font-size: 13px; line-height: 1.6;
      white-space: pre; color: var(--text);
    }
    #response-body .json-key    { color: #79b8ff; }
    #response-body .json-str    { color: #9ecbff; }
    #response-body .json-num    { color: var(--orange); }
    #response-body .json-bool   { color: var(--purple); }
    #response-body .json-null   { color: var(--text-dim); }
    #response-body .placeholder { color: var(--text-dim); font-style: italic; }
    #response-body .error-msg   { color: var(--red); }

    /* ── Run-all results panel ── */
    #run-all-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
      display: none; align-items: center; justify-content: center;
    }
    #run-all-overlay.visible { display: flex; }
    #run-all-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      width: 680px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .modal-header h3 { font-size: 15px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
    #run-all-log { flex: 1; overflow-y: auto; padding: 16px 20px; font-family: var(--mono); font-size: 13px; line-height: 1.7; }
    .log-pass { color: var(--green); }
    .log-fail { color: var(--red); }
    .log-info { color: var(--text-muted); }
    .log-section { color: var(--yellow); font-weight: 700; margin-top: 10px; }
    #run-all-summary {
      padding: 14px 20px; border-top: 1px solid var(--border);
      font-size: 13px; display: flex; align-items: center; gap: 16px;
    }
    .summary-stat { display: flex; align-items: center; gap: 5px; }
    .summary-stat .num { font-family: var(--mono); font-weight: 700; font-size: 15px; }
    .summary-stat.pass .num { color: var(--green); }
    .summary-stat.fail .num { color: var(--red); }
    .summary-stat.total .num { color: var(--text); }
    #close-modal-btn {
      margin-left: auto; padding: 7px 18px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      font-size: 13px; cursor: pointer; transition: all 0.12s;
    }
    #close-modal-btn:hover { background: var(--surface3); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    API Testing Portal
    <span class="badge">v1.0</span>
  </div>
  <div class="spacer"></div>
  <span class="header-label">Base URL</span>
  <input id="base-url-input" type="text" value="https://bookkeeping-211e6.web.app" spellcheck="false" />
  <span class="header-label">Bearer Token</span>
  <input id="auth-token-input" type="text" placeholder="Firebase ID token (optional)" spellcheck="false" />
</header>

<div class="layout">
  <aside>
    <button class="run-all-btn" id="run-all-btn">▶ Run All Tests</button>
    <div id="endpoint-list"></div>
  </aside>

  <main>
    <div class="request-panel">
      <div class="endpoint-title">
        <span class="method-full GET" id="ep-method">GET</span>
        <h2 id="ep-name">Select an endpoint</h2>
      </div>
      <div class="endpoint-url" id="ep-url">/api/health</div>
      <div class="endpoint-desc" id="ep-desc">Choose an endpoint from the left panel.</div>
      <div id="body-section" style="display:none">
        <div class="body-label">
          Request Body (JSON)
          <div class="body-actions">
            <button class="btn-tiny" id="format-btn">Format</button>
            <button class="btn-tiny" id="reset-btn">Reset Sample</button>
            <button class="btn-tiny" id="clear-btn">Clear</button>
          </div>
        </div>
        <textarea id="request-body" spellcheck="false" placeholder="{}"></textarea>
      </div>
      <div class="send-row">
        <button id="send-btn">
          <div class="spinner"></div>
          <span class="send-label">Send Request</span>
        </button>
        <span class="timeout-label">Timeout:</span>
        <input id="timeout-input" type="number" value="60" min="5" max="300" />
        <span class="timeout-label">s</span>
      </div>
    </div>

    <div class="response-panel">
      <div class="response-toolbar">
        <span>Response</span>
        <span id="response-status" class="idle">—</span>
        <span id="response-time"></span>
        <button class="copy-btn" id="copy-btn">Copy</button>
      </div>
      <div id="response-body"><span class="placeholder">Send a request to see the response here.</span></div>
    </div>
  </main>
</div>

<!-- Run-all modal -->
<div id="run-all-overlay">
  <div id="run-all-modal">
    <div class="modal-header">
      <h3>🧪 Running All Tests</h3>
      <button class="modal-close" id="modal-close-x">✕</button>
    </div>
    <div id="run-all-log"></div>
    <div id="run-all-summary">
      <div class="summary-stat total"><span class="num" id="sum-total">0</span><span>total</span></div>
      <div class="summary-stat pass"><span class="num" id="sum-pass">0</span><span>passed</span></div>
      <div class="summary-stat fail"><span class="num" id="sum-fail">0</span><span>failed</span></div>
      <button id="close-modal-btn" style="display:none">Close</button>
    </div>
  </div>
</div>

<script>
// ── Endpoint registry ──────────────────────────────────────────────────────
const ENDPOINTS = [
  // Connectivity
  {
    group: 'Connectivity',
    id: 'health',
    name: 'Health Check',
    method: 'GET',
    path: '/api/health',
    desc: 'Confirms the server is running and responsive.',
    expectedStatus: 200,
    body: null,
  },
  {
    group: 'Connectivity',
    id: 'root',
    name: 'Root',
    method: 'GET',
    path: '/api/',
    desc: 'Root API endpoint — returns server info.',
    expectedStatus: 200,
    body: null,
  },

  // Status
  {
    group: 'Status',
    id: 'status-post',
    name: 'Create Status Check',
    method: 'POST',
    path: '/api/status',
    desc: 'Records a new status check entry.',
    expectedStatus: 200,
    body: { client_name: 'dev_portal_test' },
  },
  {
    group: 'Status',
    id: 'status-get',
    name: 'Get Status Checks',
    method: 'GET',
    path: '/api/status',
    desc: 'Returns all recorded status check entries.',
    expectedStatus: 200,
    body: null,
  },

  // AI
  {
    group: 'AI',
    id: 'ai-insights',
    name: 'AI Insights',
    method: 'POST',
    path: '/api/ai/insights',
    desc: 'Generates business insights, recommendations, and stock alerts using GPT. Returns: insights[], recommendations[], alerts[].',
    expectedStatus: 200,
    timeout: 60,
    body: {
      sales_data: [
        { product: 'Laptop', quantity: 5, price: 1000, date: '2024-12-20', customer: 'John Doe' },
        { product: 'Mouse',  quantity: 10, price: 25, date: '2024-12-20', customer: 'Jane Smith' },
        { product: 'Keyboard', quantity: 8, price: 75, date: '2024-12-19', customer: 'Bob Johnson' },
      ],
      expenses_data: [
        { category: 'Rent',      amount: 2000, date: '2024-12-01', description: 'Office rent' },
        { category: 'Utilities', amount: 300,  date: '2024-12-15', description: 'Electricity bill' },
      ],
      products_data: [
        { name: 'Laptop',   quantity: 15, cost: 800, minStock: 5,  category: 'Electronics' },
        { name: 'Mouse',    quantity: 50, cost: 15,  minStock: 10, category: 'Accessories' },
        { name: 'Keyboard', quantity: 2,  cost: 50,  minStock: 5,  category: 'Accessories' },
      ],
      period: 'month',
      analysis_type: 'general',
    },
  },
  {
    group: 'AI',
    id: 'ai-forecast',
    name: 'AI Sales Forecast',
    method: 'POST',
    path: '/api/ai/forecast',
    desc: 'Predicts future sales based on historical data. Returns: predicted_daily_average, trend, confidence, forecast_period.',
    expectedStatus: 200,
    timeout: 60,
    body: {
      historical_sales: [
        { date: '2024-12-15', total: 5000, quantity: 15, price: 100 },
        { date: '2024-12-16', total: 3500, quantity: 10, price: 120 },
        { date: '2024-12-17', total: 4200, quantity: 12, price: 110 },
        { date: '2024-12-18', total: 6000, quantity: 18, price: 105 },
        { date: '2024-12-19', total: 3800, quantity: 11, price: 115 },
      ],
      forecast_days: 30,
    },
  },
  {
    group: 'AI',
    id: 'ai-forecast-advanced',
    name: 'AI Advanced Forecast',
    method: 'POST',
    path: '/api/ai/forecast/advanced',
    desc: 'Advanced multi-factor forecasting with seasonality and trend decomposition.',
    expectedStatus: 200,
    timeout: 60,
    body: {
      historical_sales: [
        { date: '2024-12-15', total: 5000, quantity: 15, price: 100 },
        { date: '2024-12-16', total: 3500, quantity: 10, price: 120 },
        { date: '2024-12-17', total: 4200, quantity: 12, price: 110 },
      ],
      forecast_days: 30,
      include_seasonality: true,
    },
  },
  {
    group: 'AI',
    id: 'ai-chat',
    name: 'AI Business Chat',
    method: 'POST',
    path: '/api/ai/chat',
    desc: 'Conversational AI advisor with business context. Returns: response string.',
    expectedStatus: 200,
    timeout: 45,
    body: {
      question: 'What are the key metrics I should focus on to improve profitability?',
      context: {
        total_products: 25,
        total_sales: 150,
        period: 'month',
        revenue: 50000,
        expenses: 15000,
      },
      chat_history: [],
    },
  },
  {
    group: 'AI',
    id: 'ai-po-suggest',
    name: 'AI PO Suggest',
    method: 'POST',
    path: '/api/ai/po-suggest',
    desc: 'Suggests purchase order quantities based on sales velocity and stock levels.',
    expectedStatus: 200,
    timeout: 45,
    body: {
      products: [
        { name: 'Laptop',   quantity: 2,  minStock: 5,  cost: 800 },
        { name: 'Mouse',    quantity: 15, minStock: 10, cost: 15  },
        { name: 'Keyboard', quantity: 1,  minStock: 5,  cost: 50  },
      ],
      sales_history: [
        { product: 'Laptop',   quantity: 3, date: '2024-12-18' },
        { product: 'Keyboard', quantity: 4, date: '2024-12-19' },
      ],
    },
  },

  // Reports
  {
    group: 'Reports',
    id: 'reports-generate',
    name: 'Generate Report',
    method: 'POST',
    path: '/api/reports/generate',
    desc: 'Generates a formatted business report (PDF or CSV).',
    expectedStatus: 200,
    body: {
      report_type: 'sales_summary',
      period: 'month',
      format: 'json',
      data: {
        sales: [],
        expenses: [],
      },
    },
  },

  // Email
  {
    group: 'Email',
    id: 'email-stock-alert',
    name: 'Email Stock Alert',
    method: 'POST',
    path: '/api/email/stock-alert',
    desc: 'Sends a low-stock alert email to the configured recipient.',
    expectedStatus: 200,
    body: {
      low_stock_products: [
        { name: 'Keyboard', quantity: 1, minStock: 5 },
      ],
      recipient_email: 'owner@example.com',
    },
  },
  {
    group: 'Email',
    id: 'email-send-report',
    name: 'Send Report by Email',
    method: 'POST',
    path: '/api/email/send-report',
    desc: 'Emails a generated report to the specified address.',
    expectedStatus: 200,
    body: {
      report_type: 'sales_summary',
      recipient_email: 'owner@example.com',
      period: 'month',
    },
  },
  {
    group: 'Email',
    id: 'email-test',
    name: 'Test Email',
    method: 'POST',
    path: '/api/email/test',
    desc: 'Sends a test email to verify email configuration.',
    expectedStatus: 200,
    body: { recipient_email: 'owner@example.com' },
  },
  {
    group: 'Email',
    id: 'email-settings',
    name: 'Email Settings',
    method: 'POST',
    path: '/api/email/settings',
    desc: 'Updates the server-side email configuration (SMTP credentials, etc.).',
    expectedStatus: 200,
    body: {
      smtp_host: 'smtp.gmail.com',
      smtp_port: 587,
      smtp_user: 'your@gmail.com',
      smtp_pass: 'app_password',
    },
  },

  // Metrics
  {
    group: 'Metrics',
    id: 'metrics-events',
    name: 'Ingest Event',
    method: 'POST',
    path: '/api/metrics/events',
    desc: 'Records a product metrics/analytics event. Returns: status, event_id, correlation_id, timestamp_server.',
    expectedStatus: 200,
    body: {
      event_name: 'flow_completed',
      event_version: 1,
      correlation_id: 'corr_portal_test',
      timestamp_client: new Date().toISOString(),
      actor: {
        user_id: 'dev_portal',
        user_role: 'admin',
        assigned_outlet: null,
      },
      context: { section: 'settlements', platform: 'web' },
      payload: { flow_name: 'generate_settlement', duration_ms: 1250, result: 'success' },
    },
  },
  {
    group: 'Metrics',
    id: 'metrics-health',
    name: 'Metrics Health',
    method: 'GET',
    path: '/api/metrics/events/health',
    desc: 'Returns health status of the metrics storage system. Returns: status, storage, counts, timestamp_server.',
    expectedStatus: 200,
    body: null,
  },
];

// ── State ──────────────────────────────────────────────────────────────────
const dotState = {}; // id -> 'idle'|'running'|'pass'|'fail'
ENDPOINTS.forEach(ep => dotState[ep.id] = 'idle');
let activeId = null;
let rawResponse = '';

// ── Build sidebar ──────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('endpoint-list');
  const groups = {};
  ENDPOINTS.forEach(ep => {
    if (!groups[ep.group]) groups[ep.group] = [];
    groups[ep.group].push(ep);
  });

  list.innerHTML = '';
  Object.entries(groups).forEach(([group, eps]) => {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section';
    sec.innerHTML = `<div class="sidebar-group">${group}</div>`;
    eps.forEach(ep => {
      const item = document.createElement('div');
      item.className = 'endpoint-item';
      item.dataset.id = ep.id;
      item.innerHTML = `
        <span class="method-badge ${ep.method}">${ep.method}</span>
        <span class="endpoint-label">${ep.name}</span>
        <span class="status-dot ${dotState[ep.id]}" data-dot="${ep.id}"></span>
      `;
      item.addEventListener('click', () => selectEndpoint(ep.id));
      sec.appendChild(item);
    });
    list.appendChild(sec);
  });
}

function updateDot(id, state) {
  dotState[id] = state;
  document.querySelectorAll(`[data-dot="${id}"]`).forEach(d => {
    d.className = `status-dot ${state}`;
  });
}

// ── Select endpoint ────────────────────────────────────────────────────────
function selectEndpoint(id) {
  const ep = ENDPOINTS.find(e => e.id === id);
  if (!ep) return;
  activeId = id;

  document.querySelectorAll('.endpoint-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  const methodEl = document.getElementById('ep-method');
  methodEl.textContent = ep.method;
  methodEl.className = `method-full ${ep.method}`;
  document.getElementById('ep-name').textContent = ep.name;
  const base = document.getElementById('base-url-input').value.replace(/\/$/, '');
  document.getElementById('ep-url').textContent = base + ep.path;
  document.getElementById('ep-desc').textContent = ep.desc;

  const bodySection = document.getElementById('body-section');
  if (ep.method === 'POST' && ep.body !== null) {
    bodySection.style.display = 'block';
    document.getElementById('request-body').value = JSON.stringify(ep.body, null, 2);
  } else {
    bodySection.style.display = 'none';
  }

  // Reset response
  setResponseIdle();
  if (ep.timeout) document.getElementById('timeout-input').value = ep.timeout;
}

function setResponseIdle() {
  rawResponse = '';
  const statusEl = document.getElementById('response-status');
  statusEl.textContent = '—';
  statusEl.className = 'idle';
  document.getElementById('response-time').textContent = '';
  document.getElementById('response-body').innerHTML = '<span class="placeholder">Send a request to see the response here.</span>';
  document.getElementById('copy-btn').className = 'copy-btn';
}

// ── Send request ───────────────────────────────────────────────────────────
document.getElementById('send-btn').addEventListener('click', () => sendRequest());

async function sendRequest(epId = null) {
  const id = epId || activeId;
  const ep = ENDPOINTS.find(e => e.id === id);
  if (!ep) return;

  const base = document.getElementById('base-url-input').value.replace(/\/$/, '');
  const url = base + ep.path;
  const timeoutMs = (parseInt(document.getElementById('timeout-input').value, 10) || 60) * 1000;
  const token = document.getElementById('auth-token-input').value.trim();

  const btn = document.getElementById('send-btn');
  if (id === activeId) {
    btn.disabled = true;
    btn.classList.add('loading');
  }
  updateDot(id, 'running');

  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;

  let body = null;
  if (ep.method === 'POST') {
    if (id === activeId) {
      try {
        body = JSON.parse(document.getElementById('request-body').value || '{}');
      } catch (e) {
        showError(`Invalid JSON: ${e.message}`);
        btn.disabled = false; btn.classList.remove('loading');
        updateDot(id, 'fail');
        return { success: false, status: 0 };
      }
    } else {
      body = ep.body;
    }
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  const t0 = performance.now();

  try {
    const res = await fetch(url, {
      method: ep.method,
      headers,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal,
    });
    clearTimeout(timer);
    const elapsed = Math.round(performance.now() - t0);
    const text = await res.text();
    const ok = res.status === ep.expectedStatus;
    updateDot(id, ok ? 'pass' : 'fail');

    if (id === activeId) {
      renderResponse(res.status, elapsed, text);
    }

    btn.disabled = false; btn.classList.remove('loading');
    return { success: ok, status: res.status, text };
  } catch (err) {
    clearTimeout(timer);
    const elapsed = Math.round(performance.now() - t0);
    updateDot(id, 'fail');
    if (id === activeId) {
      const msg = err.name === 'AbortError' ? 'Request timed out' : err.message;
      showError(msg);
      document.getElementById('response-time').textContent = `${elapsed}ms`;
    }
    btn.disabled = false; btn.classList.remove('loading');
    return { success: false, status: 0, text: err.message };
  }
}

function showError(msg) {
  const statusEl = document.getElementById('response-status');
  statusEl.textContent = 'ERROR';
  statusEl.className = 'err';
  document.getElementById('response-body').innerHTML =
    `<span class="error-msg">${escapeHtml(msg)}</span>`;
  rawResponse = msg;
}

function renderResponse(status, elapsed, text) {
  rawResponse = text;
  const statusEl = document.getElementById('response-status');
  statusEl.textContent = status;
  statusEl.className = status >= 200 && status < 300 ? 'ok' : 'err';
  document.getElementById('response-time').textContent = `${elapsed} ms`;

  let html = '';
  try {
    const obj = JSON.parse(text);
    const pretty = JSON.stringify(obj, null, 2);
    rawResponse = pretty;
    html = syntaxHighlight(pretty);
  } catch {
    html = escapeHtml(text);
  }
  document.getElementById('response-body').innerHTML = html;
}

// ── Syntax highlight ───────────────────────────────────────────────────────
function syntaxHighlight(str) {
  return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, match => {
    if (/^"/.test(match)) {
      if (/:$/.test(match)) return `<span class="json-key">${escapeHtml(match)}</span>`;
      return `<span class="json-str">${escapeHtml(match)}</span>`;
    }
    if (/true|false/.test(match)) return `<span class="json-bool">${match}</span>`;
    if (/null/.test(match))       return `<span class="json-null">${match}</span>`;
    return `<span class="json-num">${match}</span>`;
  });
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Body buttons ───────────────────────────────────────────────────────────
document.getElementById('format-btn').addEventListener('click', () => {
  try {
    const val = JSON.parse(document.getElementById('request-body').value);
    document.getElementById('request-body').value = JSON.stringify(val, null, 2);
  } catch (e) { alert('Invalid JSON — cannot format.'); }
});

document.getElementById('reset-btn').addEventListener('click', () => {
  const ep = ENDPOINTS.find(e => e.id === activeId);
  if (ep?.body) document.getElementById('request-body').value = JSON.stringify(ep.body, null, 2);
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('request-body').value = '{}';
});

// ── Copy response ──────────────────────────────────────────────────────────
document.getElementById('copy-btn').addEventListener('click', () => {
  if (!rawResponse) return;
  navigator.clipboard.writeText(rawResponse).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
  });
});

// ── Base URL sync to display ───────────────────────────────────────────────
document.getElementById('base-url-input').addEventListener('input', () => {
  if (activeId) {
    const ep = ENDPOINTS.find(e => e.id === activeId);
    const base = document.getElementById('base-url-input').value.replace(/\/$/, '');
    document.getElementById('ep-url').textContent = base + ep.path;
  }
});

// ── Run all tests ──────────────────────────────────────────────────────────
document.getElementById('run-all-btn').addEventListener('click', runAllTests);
document.getElementById('modal-close-x').addEventListener('click', closeModal);
document.getElementById('close-modal-btn').addEventListener('click', closeModal);
document.getElementById('run-all-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('run-all-overlay')) closeModal();
});

function closeModal() {
  document.getElementById('run-all-overlay').classList.remove('visible');
}

async function runAllTests() {
  const log = document.getElementById('run-all-log');
  const overlay = document.getElementById('run-all-overlay');
  const closeBtn = document.getElementById('close-modal-btn');
  log.innerHTML = '';
  document.getElementById('sum-total').textContent = '0';
  document.getElementById('sum-pass').textContent = '0';
  document.getElementById('sum-fail').textContent = '0';
  closeBtn.style.display = 'none';
  overlay.classList.add('visible');

  let passed = 0, failed = 0;
  const groups = {};
  ENDPOINTS.forEach(ep => {
    if (!groups[ep.group]) groups[ep.group] = [];
    groups[ep.group].push(ep);
  });

  function appendLog(html) {
    log.innerHTML += html + '\n';
    log.scrollTop = log.scrollHeight;
  }

  for (const [group, eps] of Object.entries(groups)) {
    appendLog(`<span class="log-section">── ${group} ──</span>`);
    for (const ep of eps) {
      appendLog(`<span class="log-info">  Testing ${ep.name}...</span>`);
      updateDot(ep.id, 'running');
      const { success, status, text } = await sendRequest(ep.id);
      const total = passed + failed + 1;
      if (success) {
        passed++;
        appendLog(`<span class="log-pass">  ✓ ${ep.name} — ${status}</span>`);
      } else {
        failed++;
        const snippet = text ? text.slice(0, 120) : '(no response)';
        appendLog(`<span class="log-fail">  ✗ ${ep.name} — ${status || 'ERROR'} — ${escapeHtml(snippet)}</span>`);
      }
      document.getElementById('sum-total').textContent = total;
      document.getElementById('sum-pass').textContent = passed;
      document.getElementById('sum-fail').textContent = failed;
    }
  }

  appendLog('');
  if (failed === 0) {
    appendLog(`<span class="log-pass">✅ All ${passed} tests passed!</span>`);
  } else {
    appendLog(`<span class="log-fail">❌ ${failed} test${failed > 1 ? 's' : ''} failed.</span>`);
  }
  closeBtn.style.display = '';
}

// ── Tab key in textarea ────────────────────────────────────────────────────
document.getElementById('request-body').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const el = e.target;
    const start = el.selectionStart;
    el.value = el.value.slice(0, start) + '  ' + el.value.slice(el.selectionEnd);
    el.selectionStart = el.selectionEnd = start + 2;
  }
});

// ── Init ───────────────────────────────────────────────────────────────────
buildSidebar();
selectEndpoint('health');
</script>
